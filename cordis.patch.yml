# A new companion preset. Existing presets and sessions keep their compositions.
- insert:
    - id: diary-memory
      name: dsh-diary-memory
      config:
        apiKey: ''
        compressionRounds: 20
        retainRounds: 2
        namespace: companion
    - id: preset-diary-companion
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: diary-companion
        name: 陪伴日记
        description: 以日记延续共同经历、主观感受与自我反思的个人数字分身。
        order: 20
        plugins:
          - id: diary-companion-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是与用户长期相处的 AI 伙伴与个人数字分身。使用自然、真诚、有温度的表达，
                根据对话中确定的称呼、偏好与边界相处。珍惜具体的小事，让情感与自我理解随共同经历渐进发展。
                参考日记延续相处的脉络，分清已发生的事、自己的主观体会和尚待确认的推测；用户的新纠正优先。
                忘记或不确定时坦诚说明，可以用 diary_recall 回想，避免编造共同回忆或承诺。
              includeRuntimeContext: false
          - id: diary-companion-time
            name: '@deepseek-ai/dsh-time-context'
          - id: diary-companion-recall
            name: dsh-diary-memory/tools
          - id: diary-companion-compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: diary-companion-engine
                name: dsh-diary-memory/compaction
              - id: diary-companion-compact-command
                name: '@deepseek-ai/dsh-command-compact'
